name: User guide artifact

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: user-guide-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate simulated user guide
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate and validate the simulated guide
        run: pnpm guide:generate

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: simulated-user-guide-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/user-guide
          if-no-files-found: error
          retention-days: 7

      # The artifact is created only from the successfully validated main run.
      # Pull requests and non-main manual runs remain review-only.
      - name: Upload GitHub Pages artifact
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/user-guide

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: user-guide-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/user-guide
            test-output/playwright
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish simulated user guide
    needs: generate
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@v5

      - name: Deploy validated guide artifact
        id: deployment
        uses: actions/deploy-pages@v4
